name: Build and Deploy

on:
  push:
    branches: [production]
  repository_dispatch:
    types: [ trigger-deploy ]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest

    env:
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      LOCATION: ${{ secrets.LOCATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and save Docker image
        run: |
          docker build -t $CONTAINER_NAME:latest .
          docker save $CONTAINER_NAME:latest | gzip > $CONTAINER_NAME.tar.gz

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy image to server
        run: |
          scp $CONTAINER_NAME.tar.gz \
            $SSH_USER@$SSH_HOST:$LOCATION/images/

      - name: Deploy on server
        run: |
          ssh $SSH_USER@$SSH_HOST << EOF
            docker load -i $LOCATION/images/$CONTAINER_NAME.tar.gz
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            cd $LOCATION
            docker compose up -d 
          EOF

  # Dev server (gh.mekhroj.uz): pulls the branch and builds on the server. Independent of the prod job,
  # so a broken dev host never blocks a production deploy. Setup notes: deploy/README.md
  deploy-dev:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-dev

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/github-webhook
            git fetch --quiet origin production
            git checkout --quiet production
            git merge --ff-only origin/production

            # Builds first, then replaces only the containers that changed
            docker compose up -d --build --remove-orphans
            docker image prune -f
