name: Build and Deploy

on:
  push:
    branches: [production]
  repository_dispatch:
    types: [ trigger-deploy ]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Production (gh.mekhroj.uz): pulls the branch and builds on the server.
  # Setup notes: deploy/README.md
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/github-webhook
            git fetch --quiet origin production
            git checkout --quiet production
            git merge --ff-only origin/production

            # Builds first, then replaces only the containers that changed
            docker compose up -d --build --remove-orphans
            docker image prune -f
