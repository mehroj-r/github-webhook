version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: production
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: production

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: production
