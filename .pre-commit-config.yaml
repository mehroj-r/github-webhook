repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check src --extra-search-path src --exclude migrations --exclude src/tests --exclude tests --exclude test
        language: system
        pass_filenames: false
        types: [python]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest src/tests --tb=short
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
